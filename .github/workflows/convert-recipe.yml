name: Ingest recipe scan

on:
  push:
    branches: [main]
    paths:
      - 'recipes-site/public/skannar/**'
  workflow_dispatch:
    inputs:
      images:
        description: 'Comma-separated image filenames to (re)process (e.g. PXL_123.jpg,PXL_456.jpg). Leave empty to auto-detect from last commit.'
        required: false
        default: ''
      fix_rotation:
        description: 'Instead of ingesting: check ALL existing scans and rotate the ones whose handwriting is sideways.'
        type: boolean
        required: false
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find new images
        id: find-images
        run: |
          if [ "${{ inputs.fix_rotation }}" = "true" ]; then
            echo "Rotation-repair mode: checking all existing scans."
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.images }}" ]; then
            echo "Using manually specified images: ${{ inputs.images }}"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            NEW_IMAGES=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'recipes-site/public/skannar/*' | grep -iE '\.(jpg|jpeg|png|gif|webp)$' || true)
            if [ -z "$NEW_IMAGES" ]; then
              echo "No new images found."
              echo "found=false" >> "$GITHUB_OUTPUT"
            else
              echo "Found new images:"
              echo "$NEW_IMAGES"
              echo "found=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Setup Python
        if: steps.find-images.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.find-images.outputs.found == 'true'
        run: pip install anthropic pillow

      - name: Extract metadata and commit
        if: steps.find-images.outputs.found == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMAGE_NAMES: ${{ inputs.images }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.fix_rotation }}" = "true" ]; then
            python .github/scripts/convert_recipe.py --fix-rotation
          else
            python .github/scripts/convert_recipe.py
          fi
          git push origin HEAD:main

      - name: Trigger deploy
        if: steps.find-images.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
